{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    {% comment %} <meta http-equiv="X-UA-Compatible" content="IE=edge"> {% endcomment %}
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AdoptionApp{% endblock title %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/global.css' %}">
</head>
<body>
    <header>
        <div class="d-flex justify-content-between py-3 container">
            <a href="" class="d-flex align-items-center text-decoration-none">
                <i class="bi bi-heart-fill me-1"></i>
                Adotar&Amar
            </a>
            <ul class="nav align-items-center">
                <li class="nav-item">
                    <a class="btn">Animais</a>
                </li>
                <li class="nav-item">
                    <a class="btn">Como adotar?</a>
                </li>
                <li class="nav-item">
                    <a class="btn">Sobre</a>
                </li>
                <li class="nav-item">
                    <a class="btn">Contato</a>
                </li>
                <li class="nav-item">
                    <a class="btn">
                        <i class="bi bi-person-circle" style="font-size: 2rem;"></i>
                    </a>
                </li>
            </ul>
        </div>
    </header>

    {% block body %}
    
    {% endblock body %}

    <footer class="mt-5 px-auto">
        <div class="container d-flex justify-content-center text-light">
            <p>© 2026 Adotar&Amar</p>
            <span class="mx-2">·</span>
            <p>Trabalho Acadêmico</p>
            <span class="mx-2">·</span>
            <p>Porto Alegre, RS</p>
        </div>
    </footer>
    
    <script src="{% static 'js/global.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>

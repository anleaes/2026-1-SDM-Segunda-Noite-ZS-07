{% extends 'base.html' %}

{% block title %}
    Trocar senha - {{ block.super}}
{% endblock title %}
    
{% block body %}
    
<br />
<br />
<p>Alterar Senha</p>
<form action="" method="POST">
    {% csrf_token %}

    <label>Senha anterior</label>
    <br />
    {{ form.old_password }}
    <br /><br />

    <label>Nova senha</label>
    <br />
    {{ form.new_password1 }}
    <br /><br />

    <label>Confirmar nova senha</label>
    <br />
    {{ form.new_password2 }}
    <br /><br />

    <button type="submit" style="padding: 8px 20px; cursor: pointer; color: black;">Atualizar</button>
</form>
    
{% endblock body %}

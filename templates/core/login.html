{% extends 'base.html' %}

{% block title %}Login - Adotar&Amar{% endblock title %}

{% block body %}

<main class="d-flex align-items-center justify-content-center" style="min-height: calc(100vh - 160px);">
    <div class="card shadow-sm w-100 mx-3" style="max-width:420px;">
        <div class="card-body">
            <h5 class="card-title fw-bold mb-4 text-center">Entrar na sua conta</h5>

            <form method="post" action="">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input id="email" name="email" type="email" class="form-control" placeholder="seu@email.com" required>
                </div>

                <div class="mb-1">
                    <label for="password" class="form-label">Senha</label>
                    <input id="password" name="password" type="password" class="form-control" placeholder="Senha" required>
                </div>

                <div class="mb-3">
                    <a href="#" class="small text-decoration-none">Esqueci minha senha?</a>
                </div>

                <div class="d-grid gap-2">
                      <button type="submit" class="btn btn-primary">Entrar</button>
                      <a href="#" class="btn btn-secondary">Registre-se</a>
                </div>
            </form>
        </div>
    </div>
</main>

{% endblock body %}
